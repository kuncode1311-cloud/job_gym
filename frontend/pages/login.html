<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FITNESS - Đăng nhập Hệ thống Gym</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; padding: 0; overflow-x: hidden;">

  <!-- Khung bao toàn màn hình đăng nhập chuẩn Figma Desktop - 1 -->
  <div class="figma-login-wrapper">
    
    <div></div> <!-- Khoảng trống phía trên để căn giữa -->

    <!-- Vùng trung tâm: Tiêu đề FITNESS và Form đăng nhập -->
    <div class="figma-login-center">
      <!-- Tiêu đề chữ rỗng FITNESS -->
      <h1 class="figma-brand-title">FITNESS</h1>

      <!-- Form nhập thông tin -->
      <form id="loginForm" class="figma-login-form">
        <!-- Trường Tên đăng nhập -->
        <div>
          <div class="figma-label">Tên đăng nhập</div>
          <div class="figma-input-box">
            <i class="fa fa-user input-icon"></i>
            <input type="text" id="username" placeholder="Nhập tên đăng nhập..." value="admin" required autocomplete="username">
          </div>
        </div>

        <!-- Trường Mật khẩu -->
        <div>
          <div class="figma-label">Mật khẩu</div>
          <div class="figma-input-box">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Nhập mật khẩu..." value="123456" required autocomplete="current-password">
            <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility()" title="Hiện/ẩn mật khẩu">
              <i id="eyeIcon" class="fa fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <!-- Link Tạo tài khoản -->
        <div class="figma-register-link">
          <a href="register.html">Tạo tài khoản?</a>
        </div>

        <!-- Nút ĐĂNG NHẬP -->
        <button type="submit" class="figma-btn-submit">
          ĐĂNG NHẬP
        </button>

        <!-- Thanh chọn nhanh tài khoản mẫu để chấm bài / demo -->
        <div class="figma-demo-bar">
          <span style="font-size: 12px; color: #9CA3AF; width: 100%; text-align: center; margin-bottom: 4px;">⚡ Tài khoản mẫu test nhanh:</span>
          <button type="button" class="demo-chip" onclick="fillDemoAccount('admin')">👑 Admin (Quản lý)</button>
          <button type="button" class="demo-chip" onclick="fillDemoAccount('staff01')">👤 Staff (Lễ tân)</button>
          <button type="button" class="demo-chip" onclick="fillDemoAccount('trainer01')">🏋️ Trainer (HLV)</button>
          <button type="button" class="demo-chip" onclick="fillDemoAccount('member01')">💪 Member (Hội viên)</button>
        </div>
      </form>
    </div>

    <!-- Vùng chân trang: Thông tin liên hệ góc trái & Khẩu hiệu đỏ góc phải -->
    <div class="figma-footer-row">
      <!-- Thông tin liên hệ góc trái dưới -->
      <div class="figma-contact-info">
        <div>Địa chỉ: 1234567892345678</div>
        <div>Hotline:113</div>
        <div>Email: fitness123@gmail.com</div>
      </div>

      <!-- Khẩu hiệu thư pháp đỏ: "Sức mạnh và làm giàu" -->
      <div class="figma-slogan-red">
        Sức mạnh và làm giàu
      </div>
    </div>


  </div>

  <!-- Scripts xử lý nghiệp vụ -->
  <script src="../js/mock_data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    // Hàm ẩn / hiện mật khẩu
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.className = 'fa fa-eye';
      } else {
        pwdInput.type = 'password';
        eyeIcon.className = 'fa fa-eye-slash';
      }
    }
  </script>
</body>
</html>
